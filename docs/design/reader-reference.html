    {v:1,chap:8,opening:true,t:"There is therefore now no condemnation to them which are in Christ Jesus, who walk not after the flesh, but after the Spirit."},

    {v:2,chap:9,t:"That I have great heaviness and continual sorrow in my heart."}
  ];
  var SEED=[
    {v:1,chap:8,text:"no condemnation",cid:"condemn",al:[["condemnation","κατάκριμα","katákrima"]]},

    {v:6,chap:8,text:"peace",cid:"peace",al:[["peace","εἰρήνη","eirḗnē"]]},

  ];
  var seq=1;
  VERSES.forEach(function(verse,i){ verse.idx=i; verse.marks=[]; });
  function findVerse(v,chap){ return VERSES.find(function(x){ return x.v===v && x.chap===chap; }); }
  SEED.forEach(function(s){
    var verse=findVerse(s.v,s.chap); if(!verse) return;
    var start=verse.t.indexOf(s.text); if(start<0) return; var end=start+s.text.length;
    var aligns=(s.al||[]).map(function(a,k){ var w=a[0], i=verse.t.slice(start,end).indexOf(w); var as=i>=0?start+i:start; return { id:"a"+(seq)+"_"+k, s:as, e:as+w.length, grc:a[1], tl:a[2] }; });
    verse.marks.push({ id:"m"+(seq++), cid:s.cid, start:start, end:end, aligns:aligns });
  });

  // ---------- render ----------
  function renderMark(verse,m){
    var t=verse.t, inner="", cur=m.start;
    (m.aligns||[]).slice().sort(function(a,b){return a.s-b.s;}).forEach(function(a){
      if(a.s<cur) return; inner+=esc(t.slice(cur,a.s));
      inner+='<span class="al" data-alid="'+a.id+'">'+esc(t.slice(a.s,a.e))+'<span class="ruby"><span class="g">'+a.grc+'</span> '+a.tl+'</span></span>'; cur=a.e;
    });
    inner+=esc(t.slice(cur,m.end));
    var c=m.cid?C(m.cid):null, color=c?c.color:"var(--neutral)";
    return '<mark class="cm'+(m.id===activeMarkId?" active":"")+'" data-id="'+m.id+'" data-c="'+(m.cid||"")+'" style="--c:'+color+'">'+inner+'</mark>';
  }
  function renderVerse(verse){
    var t=verse.t, marks=verse.marks.slice().sort(function(a,b){return a.start-b.start;}), out="", cur=0;
    marks.forEach(function(m){ if(m.start<cur) return; out+=esc(t.slice(cur,m.start)); out+=renderMark(verse,m); cur=m.end; });
    out+=esc(t.slice(cur));
    if(verse.opening){ out='<span class="versal">'+out.charAt(0)+'</span>'+out.slice(1); }
    var vn=verse.opening?"":'<span class="vn">'+verse.v+'</span>';
    var als=[]; verse.marks.forEach(function(m){ (m.aligns||[]).forEach(function(a){ als.push(a); }); });
    var il=als.length?'<span class="interlin">'+als.sort(function(a,b){return a.s-b.s;}).map(function(a){ return '<button type="button" class="gk" data-alid="'+a.id+'"><span class="grc">'+a.grc+'</span> '+a.tl+'</button>'; }).join("")+'</span>':"";
    var cls="v"+(verse.chapStart?" chap-start":""); var chap=verse.chapStart?' data-chap="'+verse.chap+'"':"";
    return '<span class="'+cls+'" data-idx="'+verse.idx+'"'+chap+'>'+vn+out+il+'</span> ';
  }
  function renderChapter(){ $("#vflow").innerHTML=VERSES.map(renderVerse).join(""); applyColors(); positionHandles(); }
  function applyColors(){ $$(".cm").forEach(function(el){ var c=el.getAttribute("data-c")?C(el.getAttribute("data-c")):null; el.style.setProperty("--c", c?c.color:"var(--neutral)"); el.classList.toggle("on", selected.has(el.getAttribute("data-c"))); }); }

  // ---------- offset mapping ----------
  function plainOffset(verseEl, node, offset){
    var w=document.createTreeWalker(verseEl, NodeFilter.SHOW_TEXT, { acceptNode:function(n){ var p=n.parentElement; return (p.closest(".vn")||p.closest(".ruby")||p.closest(".interlin"))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; } });
    var total=0, tn; while((tn=w.nextNode())){ if(tn===node) return total+offset; total+=tn.nodeValue.length; }
    return total;
  }
  function snapStart(t,o){ o=Math.max(0,Math.min(t.length,o)); while(o>0 && /\S/.test(t[o-1])) o--; return o; }
  function snapEnd(t,o){ o=Math.max(0,Math.min(t.length,o)); while(o<t.length && /\S/.test(t[o])) o++; return o; }
  function verseElOf(node){ var el=node.nodeType===3?node.parentElement:node; return el&&el.closest?el.closest(".v"):null; }
  function verseFromEl(el){ return VERSES[+el.getAttribute("data-idx")]; }

  // ---------- selection + popup ----------
  var COARSE=!!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches);
  var pendingSel=null, assignMode=false;
  function getSelInfo(){
    var sel=window.getSelection(); if(!sel||sel.isCollapsed) return null;
    if(sel.toString().trim().length<2) return null;
    var range=sel.getRangeAt(0), sv=verseElOf(range.startContainer), ev=verseElOf(range.endContainer);
    if(!sv||sv!==ev) return null;
    var verse=verseFromEl(sv);
    var s=snapStart(verse.t, plainOffset(sv,range.startContainer,range.startOffset));
    var e=snapEnd(verse.t, plainOffset(sv,range.endContainer,range.endOffset));
    if(e<=s) return null;
    return { verse:verse, s:s, e:e, rect:range.getBoundingClientRect() };
  }
  function onSelect(){
    if(assignMode) return;
    var info=getSelInfo();
    if(!info){ return; }
    pendingSel={ verse:info.verse, s:info.s, e:info.e };
    showPopup(info.rect);
  }
  function showPopup(rect){
    var pop=$("#pop"); pop.classList.add("show");
    var pw=pop.offsetWidth||260, ph=pop.offsetHeight||48;
    var left=rect.left, top=rect.bottom+8;
    if(left+pw>window.innerWidth-12) left=window.innerWidth-pw-12; if(left<12) left=12;
    if(top+ph>window.innerHeight-12) top=Math.max(12, rect.top-ph-8);
    pop.style.left=left+"px"; pop.style.top=top+"px";
  }
  function hidePopup(){ $("#pop").classList.remove("show"); }
  function clearPending(){ pendingSel=null; assignMode=false; hidePopup(); var s=window.getSelection(); if(s) s.removeAllRanges(); renderPanel(); }

  function createMark(cid){
    if(!pendingSel) return;
    var verse=pendingSel.verse, id="m"+(seq++);
    verse.marks.push({ id:id, cid:cid, start:pendingSel.s, end:pendingSel.e, aligns:[] });
    activeMarkId=id; if(cid){ selected.add(cid); lastActive=cid; }
    pendingSel=null; assignMode=false; hidePopup();
    var s=window.getSelection(); if(s) s.removeAllRanges();
    renderChapter(); refresh(); positionHandles();

  }

  // ---------- handles ----------
  var activeMarkId=null;
  function findMark(id){ for(var i=0;i<VERSES.length;i++){ var m=VERSES[i].marks.find(function(x){return x.id===id;}); if(m) return { mark:m, verse:VERSES[i] }; } return null; }
  function positionHandles(){
    var hs=$("#hStart"), he=$("#hEnd");
    if(!activeMarkId){ hs.classList.remove("show"); he.classList.remove("show"); return; }
    var el=$('.cm[data-id="'+activeMarkId+'"]'); if(!el){ hs.classList.remove("show"); he.classList.remove("show"); return; }
    var rects=el.getClientRects(); if(!rects.length){ hs.classList.remove("show"); he.classList.remove("show"); return; }
    var f=rects[0], l=rects[rects.length-1];
    hs.classList.add("show"); hs.style.left=f.left+"px"; hs.style.top=f.top+"px"; hs.style.height=f.height+"px";
    he.classList.add("show"); he.style.left=l.right+"px"; he.style.top=l.top+"px"; he.style.height=l.height+"px";
  }
  function caretInfo(x,y){ if(document.caretRangeFromPoint){ var r=document.caretRangeFromPoint(x,y); return r?{node:r.startContainer,offset:r.startOffset}:null; } if(document.caretPositionFromPoint){ var p=document.caretPositionFromPoint(x,y); return p?{node:p.offsetNode,offset:p.offset}:null; } return null; }
  function dragHandle(which,x,y){
    var fm=findMark(activeMarkId); if(!fm) return;
    var vEl=$('.v[data-idx="'+fm.verse.idx+'"]'); if(!vEl) return;
    var ci=caretInfo(x,y); if(!ci||!vEl.contains(ci.node)) return;
    var off=plainOffset(vEl,ci.node,ci.offset), t=fm.verse.t;
    if(which==="start"){ var ns=snapStart(t,off); if(ns<fm.mark.end) fm.mark.start=ns; }
    else { var ne=snapEnd(t,off); if(ne>fm.mark.start) fm.mark.end=ne; }

  }
  function bindHandle(el,which){
    el.addEventListener("pointerdown",function(e){ e.preventDefault(); el.setPointerCapture(e.pointerId);

      var up=function(){ try{el.releasePointerCapture(e.pointerId);}catch(_){} document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); };
      document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
    });
  }
  bindHandle($("#hStart"),"start"); bindHandle($("#hEnd"),"end");

  // ---------- concept highlight (③) + panel ----------
  var selected=new Set(), lastActive=null, editing=false;
  function clearActive(){ activeMarkId=null; positionHandles(); }
  function refresh(){
    document.body.classList.toggle("has-sel", selected.size>0 || !!activeMarkId);
    applyColors();
    renderList(); if(!editing) renderPanel();
    var cs=$("#clearSel"); if(cs) cs.hidden = (selected.size===0 && !activeMarkId);
  }
  function toggleConcept(id){ if(selected.has(id)){ selected.delete(id); if(lastActive===id){ var a=Array.from(selected); lastActive=a.length?a[a.length-1]:null; } } else { selected.add(id); lastActive=id; } refresh(); }
  function clearSel(){ selected.clear(); lastActive=null; clearActive(); refresh(); }
  function phrasesFor(id){
    var out=[]; VERSES.forEach(function(verse){ verse.marks.forEach(function(m){ if(m.cid===id){ out.push({ text:verse.t.slice(m.start,m.end), v:verse.v, chap:verse.chap, words:(m.aligns||[]).map(function(a){return {grc:a.grc,tl:a.tl};}) }); } }); }); return out;
  }
  function renderList(){
    var box=$("#clist"); box.innerHTML="";
    var q=(($("#conceptSearch")&&$("#conceptSearch").value)||"").toLowerCase();
    var rows=CONCEPTS.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q)>=0; });
    if(!rows.length){ box.innerHTML='<div style="color:var(--faint);font-size:.8rem;padding:.4rem .55rem">No match for “'+esc(q)+'”.</div>'; return; }
    rows.forEach(function(c){
      var n=phrasesFor(c.id).length;
      var b=document.createElement("button"); b.className="citem"+(selected.has(c.id)?" sel":"");
      b.innerHTML='<span class="siglum" style="background:'+c.color+'"></span><span class="nm">'+esc(c.name)+'</span><span class="pol">'+c.pol+'</span><span class="ct">'+n+'</span>';
      b.addEventListener("click",function(e){ e.stopPropagation(); toggleConcept(c.id); });
      box.appendChild(b);
    });
  }
  function renderPanel(){
    var host=$("#detailHost");
    if(assignMode && pendingSel){ renderAssign(host); return; }
    if(activeMarkId){ var fm=findMark(activeMarkId); if(fm){ renderMarkCtx(host, fm); return; } }
    if(selected.size && lastActive){ renderConcept(host, lastActive); return; }
    host.innerHTML="";
  }
  function renderAssign(host){
    var txt=pendingSel.verse.t.slice(pendingSel.s, pendingSel.e);
    var q="";
    host.innerHTML='<div class="detail"><div class="ctxlabel">Mark <span class="ph">“'+esc(txt)+'”</span> as:</div>'+
      '<input class="csearch" id="assignSearch" placeholder="Find a concept…" autocomplete="off">'+
      '<div class="clist" id="assignList"></div>'+
      '<button class="addc" id="assignNew">+ Create new concept</button>'+
      '<div class="acts"><button id="assignCancel">Cancel</button></div></div>';
    function drawList(){
      var qq=($("#assignSearch").value||"").toLowerCase();
      var box=$("#assignList"); box.innerHTML="";
      CONCEPTS.filter(function(c){return !qq||c.name.toLowerCase().indexOf(qq)>=0;}).forEach(function(c){
        var b=document.createElement("button"); b.className="citem";
        b.innerHTML='<span class="siglum" style="background:'+c.color+'"></span><span class="nm">'+esc(c.name)+'</span><span class="pol">'+c.pol+'</span>';
        b.addEventListener("click",function(){ createMark(c.id); });

      });
    }

    setTimeout(function(){ var el=$("#assignSearch"); if(el) el.focus(); },20);

    $("#assignCancel").addEventListener("click",function(){ clearPending(); });
  }
  function renderMarkCtx(host, fm){
    var m=fm.mark, txt=fm.verse.t.slice(m.start,m.end), c=m.cid?C(m.cid):null;
    var head = c ? '<div class="top"><span class="swab" style="background:'+c.color+'"></span><span class="nm">'+esc(c.name)+'</span></div><div class="meta"><b>'+polLabel(c.pol)+'</b>'+(c.opp?' · opposite of <b>'+esc(c.opp)+'</b>':'')+'</div>' : '<div class="ctxlabel">Plain highlight — not tied to a concept.</div>';
    host.innerHTML='<div class="detail">'+head+
      '<div class="seclabel">Selected phrase</div><span class="ph" style="display:block;font-family:var(--read);font-style:italic">“'+esc(txt)+'”</span>'+
      '<div class="acts">'+(c?'<button id="mEdit">✎ Edit concept</button>':'')+'<button id="mChange">'+(c?"Change concept":"Assign concept")+'</button><button class="danger" id="mRemove">Remove mark</button></div>'+

  }
  function renderConcept(host, id){

    var multi=selected.size>1?'<div class="multi">'+selected.size+' concepts selected · showing '+esc(c.name)+'</div>':'';
    host.innerHTML='<div class="detail">'+multi+'<div class="top"><span class="swab" style="background:'+c.color+'"></span><span class="nm">'+esc(c.name)+'</span></div>'+
      '<div class="meta"><b>'+polLabel(c.pol)+'</b>'+(c.opp?' · opposite of <b>'+esc(c.opp)+'</b>':'')+'</div>'+
      '<div class="seclabel">Marked here ('+ph.length+')</div><div class="phrases">'+
      (ph.length?ph.map(function(p){ var gl=p.words.length?'<span class="gloss">'+p.words.map(function(w){return '<span class="g">'+w.grc+'</span> '+w.tl;}).join(" · ")+'</span>':''; return '<span class="ph">“'+esc(p.text)+'” <span class="where">'+p.chap+':'+p.v+'</span>'+gl+'</span>'; }).join(""):'<span class="ph" style="font-style:normal;color:var(--faint)">No marks here yet.</span>')+
      '</div><div class="occ">Appears in <b>'+c.corpus+'</b> verses across the corpus <span style="color:var(--faint)">· illustrative</span></div>'+
      '<div class="acts"><button id="dEdit">✎ Edit concept</button><button id="dDesel">Deselect</button></div></div>';

  }

  // ---------- edit concept + opposite ----------
  function swatches(cur,cls){ return PALETTE.map(function(h){ return '<button type="button" class="swatch '+cls+(h.toLowerCase()===(cur||"").toLowerCase()?" sel":"")+'" data-h="'+h+'" style="background:'+h+'"></button>'; }).join(""); }
  function openEdit(id, fromAssign){
    editing=true; var host=$("#detailHost"), isNew=!id, c=isNew?null:C(id);
    var f={ name:isNew?"":c.name, color:isNew?PALETTE[0]:c.color, pol:isNew?"+":(c.pol||"+"),
            opp:isNew?"":(c.opp||""), oppColor:isNew?PALETTE[1]:(c.oppColor||PALETTE[1]), hasOpp:(!isNew && !!(c.opp&&c.opp.trim())) };
    function polseg(){ return ["+","−","±"].map(function(p){ var lab=p==="+"?"Positive":p==="−"?"Negative":"Neutral"; return '<button type="button" class="pbtn'+(p===f.pol?" on":"")+'" data-p="'+p+'">'+lab+'</button>'; }).join(""); }
    function draw(){
      var opp = f.hasOpp
        ? '<div class="axis">↕</div><div class="pole neg"><div class="poletag">Opposite <button type="button" class="rmopp" id="rmOpp">remove</button></div><div class="lab">Name</div><input type="text" class="onm" value="'+f.opp.replace(/"/g,"&quot;")+'" placeholder="e.g. Despair"><div class="lab">Color</div><div class="swatches">'+swatches(f.oppColor,"o")+'</div></div>'
        : '<button type="button" class="addopp" id="addOpp">+ Add an opposite (optional)</button>';
      host.innerHTML='<div class="editc"><h3>'+(isNew?"New concept":"Edit concept")+'</h3>'+
        '<div class="pole pos"><div class="poletag">Concept</div><div class="lab">Name</div><input type="text" class="enm" value="'+f.name.replace(/"/g,"&quot;")+'" placeholder="e.g. Hope"><div class="lab">Color</div><div class="swatches">'+swatches(f.color,"c")+'</div><div class="lab">Polarity</div><div class="polrow">'+polseg()+'</div></div>'+
        opp+
        '<div class="save"><button class="go">'+(isNew?"Create concept":"Save")+'</button><button class="cancel">Cancel</button></div></div>';
      $$(".swatch.c",host).forEach(function(b){ b.addEventListener("click",function(){ f.color=b.getAttribute("data-h"); draw(); }); });
      $$(".swatch.o",host).forEach(function(b){ b.addEventListener("click",function(){ f.oppColor=b.getAttribute("data-h"); draw(); }); });
      $$(".pbtn",host).forEach(function(b){ b.addEventListener("click",function(){ f.pol=b.getAttribute("data-p"); draw(); }); });
      $(".enm",host).addEventListener("input",function(){ f.name=this.value; });
      var onm=$(".onm",host); if(onm) onm.addEventListener("input",function(){ f.opp=this.value; });
      var ao=$("#addOpp",host); if(ao) ao.addEventListener("click",function(){ f.hasOpp=true; draw(); });
      var ro=$("#rmOpp",host); if(ro) ro.addEventListener("click",function(){ f.hasOpp=false; f.opp=""; draw(); });
      $(".go",host).addEventListener("click",function(){ saveEdit(id,isNew,f,fromAssign); });
      $(".cancel",host).addEventListener("click",function(){ editing=false; renderPanel(); });
    }
    draw();
  }
  function saveEdit(id,isNew,f,fromAssign){
    var theId;
    if(isNew){ theId="c"+(seq++)+"_"+(f.name||"x").toLowerCase().replace(/\W+/g,""); CONCEPTS.push({id:theId,name:f.name||"Untitled",color:f.color,pol:f.pol,opp:f.hasOpp?f.opp:"",oppColor:f.hasOpp?f.oppColor:null,corpus:0}); }
    else { var c=C(id); c.name=f.name||c.name; c.color=f.color; c.pol=f.pol;
      if(f.hasOpp){ c.opp=f.opp; c.oppColor=f.oppColor; var oc=CONCEPTS.find(function(x){return x.id!==id && x.name.toLowerCase()===(f.opp||"").toLowerCase();}); if(oc){ oc.color=f.oppColor; oc.opp=c.name; oc.oppColor=c.color; } }
      else { c.opp=""; c.oppColor=null; } theId=id; }
    editing=false;
    if(fromAssign && pendingSel){ createMark(theId); }
    else { renderChapter(); refresh(); }
  }
  function polLabel(p){ return p==="+"?"Positive":p==="−"?"Negative":"Neutral"; }

  // ---------- delegated clicks in the text ----------
  $("#vflow").addEventListener("click",function(e){
    var chip=e.target.closest(".gk");
    if(chip){ var al=$('.al[data-alid="'+chip.getAttribute("data-alid")+'"]'); if(al){ pulse(al); var mk=al.closest(".cm"); if(mk && mk.getAttribute("data-c")) addConcept(mk.getAttribute("data-c")); } return; }
    var ruby=e.target.closest(".ruby");
    if(ruby){ e.stopPropagation(); var al2=ruby.closest(".al"); if(al2){ pulse(al2); var mk2=al2.closest(".cm"); if(mk2 && mk2.getAttribute("data-c")) addConcept(mk2.getAttribute("data-c")); } return; }
    var cm=e.target.closest(".cm");
    if(cm){ e.stopPropagation(); activeMarkId=cm.getAttribute("data-id"); var cid=cm.getAttribute("data-c"); if(cid){ if(!selected.has(cid)){ selected.add(cid); } lastActive=cid; } renderChapter(); refresh(); positionHandles(); }
  });
  function pulse(al){ al.classList.remove("pulse"); void al.offsetWidth; al.classList.add("pulse"); if(al.scrollIntoView) al.scrollIntoView({block:"center",behavior:"smooth"}); setTimeout(function(){ al.classList.remove("pulse"); },1000); }
  function addConcept(id){ selected.add(id); lastActive=id; refresh(); }

  // ---------- popup buttons ----------
  $("#popMark").addEventListener("click",function(e){ e.stopPropagation(); if(!pendingSel) return; assignMode=true; hidePopup(); renderPanel(); });
  $("#popPlain").addEventListener("click",function(e){ e.stopPropagation(); createMark(null); });
  $("#popCancel").addEventListener("click",function(e){ e.stopPropagation(); clearPending(); });

  // ---------- selection triggers + dismissal ----------
  if(COARSE){ var sct; document.addEventListener("selectionchange",function(){ clearTimeout(sct); sct=setTimeout(onSelect,360); }); }
  document.addEventListener("mouseup",function(e){ if(COARSE) return; if(e.target.closest("#pop")||e.target.closest(".apparatus")) return; setTimeout(onSelect,1); });
  // dismissal: click off the popup / off the selection clears it (state ①); also clears concept highlight (state ③)
  document.addEventListener("mousedown",function(e){
    if(e.target.closest("#pop")||e.target.closest(".apparatus")||e.target.closest(".masthead")||e.target.closest("#devbar")||e.target.closest(".handle")) return;
    if(pendingSel && !assignMode && !e.target.closest("#vflow")){ clearPending(); }
  });
  document.addEventListener("click",function(e){
    if(e.target.closest("#pop")||e.target.closest(".apparatus")||e.target.closest(".masthead")||e.target.closest("#devbar")||e.target.closest(".cm")||e.target.closest(".handle")) return;
    if(selected.size||activeMarkId){ clearSel(); }
  });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if(pendingSel){ clearPending(); } else if(selected.size||activeMarkId){ clearSel(); } else if(editing){ editing=false; renderPanel(); } } });

  // ---------- hint ----------
  var ht; function flash(msg){ var h=$("#hint"); h.textContent=msg; h.classList.add("show"); clearTimeout(ht); ht=setTimeout(function(){ h.classList.remove("show"); },2200); }

  // ---------- controls ----------
  $("#clearSel").addEventListener("click",function(e){ e.stopPropagation(); clearSel(); });
  $("#conceptSearch").addEventListener("input", renderList);
  $("#addc").addEventListener("click",function(){ clearActive(); selected.clear(); lastActive=null; openEdit(null); });
  document.body.classList.add("mode-versed");
  $$("#modeSeg button").forEach(function(b){ b.addEventListener("click",function(){ $$("#modeSeg button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); document.body.classList.remove("mode-continuous","mode-versed"); document.body.classList.add("mode-"+b.getAttribute("data-mode")); positionHandles(); }); });
  $("#grkBtn").addEventListener("click",function(){ var on=document.body.classList.toggle("greek-on"); this.classList.toggle("on",on); positionHandles(); });

  (function(){ var sel=$("#chapSel"); for(var i=1;i<=16;i++){ var o=document.createElement("option"); o.value=i; o.textContent=i; if(i===8)o.selected=true; sel.appendChild(o); }
    var rd=$("#reader");
    sel.addEventListener("change",function(){ if(this.value==="9"){ var cs=$(".chap-start"); if(cs) cs.scrollIntoView({behavior:"smooth",block:"start"}); } else { rd.scrollTo({top:0,behavior:"smooth"}); } });
    rd.addEventListener("scroll",function(){ var cs=$(".chap-start"), ch=8; if(cs && (cs.getBoundingClientRect().top - rd.getBoundingClientRect().top)<90) ch=9; if(sel.value!==String(ch)) sel.value=ch; positionHandles(); hidePopup(); });
  })();

  // ---------- iPad preview ----------
  var orient="portrait";
  function fitDevice(){ if(!document.body.classList.contains("dev")) return; var dw=orient==="portrait"?1032:1376, dh=orient==="portrait"?1376:1032; document.documentElement.style.setProperty("--dw",dw+"px"); document.documentElement.style.setProperty("--dh",dh+"px"); var dev=$("#device"); dev.style.transform="none"; var rect=dev.getBoundingClientRect(); var k=Math.min((window.innerWidth-48)/rect.width,(window.innerHeight-110)/rect.height,1); dev.style.transform="scale("+k+")"; }
  $("#ipadBtn").addEventListener("click",function(){ document.body.classList.add("dev"); fitDevice(); });
  $("#exitBtn").addEventListener("click",function(){ document.body.classList.remove("dev"); $("#device").style.transform="none"; });
  $("#rotateBtn").addEventListener("click",function(){ orient=orient==="portrait"?"landscape":"portrait"; fitDevice(); });
  window.addEventListener("resize",function(){ fitDevice(); positionHandles(); });

  // ---------- init ----------
  renderChapter(); refresh();
  setTimeout(function(){ flash("Select any phrase to mark it · drag the gold handles to resize"); },500);
})();
</script>
