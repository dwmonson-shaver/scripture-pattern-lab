name: Deploy to Cloudflare Workers

# The Nuxt web app lives under `web/`. Every `run:` step in this job
# executes inside `web/` via the `defaults` block below — the workflow
# itself lives at repo root (GitHub Actions only auto-discovers
# `.github/workflows/` at the repository root, not nested folders).
# Non-`run` steps (cache, wrangler-action) get explicit web/ paths
# because `defaults.run.working-directory` doesn't apply to them.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Restore build caches (node_modules + .nuxt)
        id: cache-nm
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            web/.nuxt
          key: build-${{ runner.os }}-node20-${{ hashFiles('web/package.json') }}
          restore-keys: |
            build-${{ runner.os }}-node20-

      - name: Install dependencies
        if: steps.cache-nm.outputs.cache-hit != 'true'
        run: npm install

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Generate API types from backend OpenAPI
        env:
          NUXT_BACKEND_URL: ${{ secrets.NUXT_BACKEND_URL }}
        run: npm run gen:types

      - name: Build (Nuxt → Cloudflare Worker bundle)
        run: npm run build

      - name: Bundle check — no LLM SDK in output
        run: npm run check:no-llm-sdk

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
